<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT US NOW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-[#D6FF00] flex items-center justify-center p-6 font-mono text-black selection:bg-black selection:text-[#D6FF00]">
    <div class="bg-white p-8 md:p-12 w-full max-w-2xl border-[8px] border-black shadow-[16px_16px_0px_rgba(0,0,0,1)]">
        <div class="mb-12 border-b-8 border-black pb-6">
            <h1 class="text-6xl md:text-8xl font-black mb-4 uppercase leading-none tracking-tighter">CONTACT<br>US NOW.</h1>
            <p class="text-xl font-bold uppercase tracking-widest bg-black text-white inline-block px-4 py-2">We demand your information</p>
        </div>

        <form id="leadForm" class="space-y-8">
            <div class="group">
                <label for="name" class="block text-2xl font-black uppercase mb-3 bg-[#FF00E4] text-white px-3 py-1 inline-block border-4 border-black shadow-[4px_4px_0px_rgba(0,0,0,1)] transition-transform group-focus-within:-translate-y-1">NAME</label>
                <input type="text" id="name" name="name" required
                    class="w-full px-6 py-4 bg-white border-[6px] border-black text-2xl font-bold focus:outline-none focus:bg-[#00FFD1] focus:shadow-[12px_12px_0px_rgba(0,0,0,1)] focus:-translate-y-2 focus:translate-x-2 transition-all duration-150"
                    placeholder="ENTER YOUR NAME">
            </div>

            <div class="group">
                <label for="email" class="block text-2xl font-black uppercase mb-3 bg-[#FF00E4] text-white px-3 py-1 inline-block border-4 border-black shadow-[4px_4px_0px_rgba(0,0,0,1)] transition-transform group-focus-within:-translate-y-1">EMAIL</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-6 py-4 bg-white border-[6px] border-black text-2xl font-bold focus:outline-none focus:bg-[#00FFD1] focus:shadow-[12px_12px_0px_rgba(0,0,0,1)] focus:-translate-y-2 focus:translate-x-2 transition-all duration-150"
                    placeholder="ENTER YOUR EMAIL">
            </div>

            <div class="group">
                <label for="message" class="block text-2xl font-black uppercase mb-3 bg-[#FF00E4] text-white px-3 py-1 inline-block border-4 border-black shadow-[4px_4px_0px_rgba(0,0,0,1)] transition-transform group-focus-within:-translate-y-1">MESSAGE</label>
                <textarea id="message" name="message" rows="5" required
                    class="w-full px-6 py-4 bg-white border-[6px] border-black text-2xl font-bold focus:outline-none focus:bg-[#00FFD1] focus:shadow-[12px_12px_0px_rgba(0,0,0,1)] focus:-translate-y-2 focus:translate-x-2 transition-all duration-150 resize-none"
                    placeholder="WHAT DO YOU WANT?"></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-[#FF3B00] hover:bg-black hover:text-[#FF3B00] text-black text-4xl font-black uppercase py-6 px-4 border-[6px] border-black shadow-[16px_16px_0px_rgba(0,0,0,1)] hover:shadow-[24px_24px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-[16px] active:translate-x-[16px] transition-all duration-150 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center group">
                <span id="btnText" class="tracking-widest">SUBMIT DATA</span>
                <svg id="loadingIcon" class="hidden animate-spin ml-4 h-10 w-10 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="6"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>

            <div id="statusMessage" class="hidden p-6 text-2xl mt-8 text-center font-black border-[6px] shadow-[8px_8px_0px_rgba(0,0,0,1)] uppercase bg-white border-black text-black"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
